<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GpsirAI - Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="glass-header">
            <a href="/" class="back-link">← Back</a>
            <h1>💬 AI Chat</h1>
            <p class="subtitle">Select a model and start chatting</p>
        </header>

        <div class="chat-container">
            <div class="model-selector">
                {% for id, model in models.items() %}
                <button class="model-select-btn" data-model="{{ id }}" onclick="selectModel('{{ id }}')" style="--model-color: {{ model.color }};">
                    <img src="/static/logos/{{ model.logo }}" alt="{{ model.name }}" style="width:24px;height:24px;object-fit:contain;">
                    {{ model.name }}
                </button>
                {% endfor %}
            </div>

            <div class="chat-box" id="chatBox">
                <div class="chat-message bot">
                    <div class="message-content">
                        👋 Hello! I'm <span id="currentModelName">GPT-5</span>. Ask me anything!
                    </div>
                </div>
            </div>

            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type your message..." autofocus>
                <button id="sendBtn">➤ Send</button>
            </div>
        </div>

        <footer>
            <p>GpsirAI LLM v1.0 | Built with ☠️ by <span>GpsirEra</span></p>
        </footer>
    </div>
    <script>
        let currentModel = 'gpt-5';
        const modelNames = {
            {% for id, model in models.items() %}
            '{{ id }}': '{{ model.name }}',
            {% endfor %}
        };

        function selectModel(modelId) {
            currentModel = modelId;
            document.getElementById('currentModelName').textContent = modelNames[modelId];
            document.querySelectorAll('.model-select-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.model === modelId);
            });
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const query = input.value.trim();
            if (!query) return;

            const chatBox = document.getElementById('chatBox');
            
            chatBox.innerHTML += `
                <div class="chat-message user">
                    <div class="message-content">${query}</div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            input.value = '';
            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;

            const loadingId = Date.now();
            chatBox.innerHTML += `
                <div class="chat-message bot" id="loading-${loadingId}">
                    <div class="message-content">⏳ Thinking...</div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: currentModel, query: query })
                });

                const data = await response.json();
                document.getElementById(`loading-${loadingId}`).remove();

                if (data.success) {
                    chatBox.innerHTML += `
                        <div class="chat-message bot">
                            <div class="message-content">${data.response}</div>
                        </div>
                    `;
                } else {
                    chatBox.innerHTML += `
                        <div class="chat-message bot error">
                            <div class="message-content">❌ Error: ${data.error || 'Unknown error'}</div>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById(`loading-${loadingId}`).remove();
                chatBox.innerHTML += `
                    <div class="chat-message bot error">
                        <div class="message-content">❌ Network error: ${error.message}</div>
                    </div>
                `;
            }

            chatBox.scrollTop = chatBox.scrollHeight;
            input.disabled = false;
            document.getElementById('sendBtn').disabled = false;
            input.focus();
        }

        selectModel('gpt-5');
    </script>
</body>
</html>
